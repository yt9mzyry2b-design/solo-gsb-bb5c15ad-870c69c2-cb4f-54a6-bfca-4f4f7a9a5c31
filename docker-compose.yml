services:
  inject:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/inject.db
      TICK_INTERVAL: "0.25"
    volumes:
      - inject-data:/data
    restart: unless-stopped
    # 启动即完成建表与旧库迁移（含回执门槛新列），就绪探针确认 HTTP 可用
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  inject-data:
